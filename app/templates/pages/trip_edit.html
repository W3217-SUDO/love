{% extends "base.html" %}
{% block title %}{{ '编辑' if trip else '新建' }} · 旅行{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ '编辑旅行' if trip else '记录一次旅行' }}</h1>
  <form action="{{ '/trip/' ~ trip.id if trip else '/trip' }}" method="post">
    <div class="form-row">
      <label class="form-label" for="title">标题</label>
      <input class="input" id="title" name="title" type="text" required maxlength="120" value="{{ trip.title if trip else '' }}">
    </div>
    <div class="form-row">
      <label class="form-label" for="location">地点</label>
      <input class="input" id="location" name="location" type="text" maxlength="120" value="{{ trip.location or '' if trip else '' }}" placeholder="京都 / Bali / ...">
    </div>
    <div class="form-row" style="display:flex; gap: var(--space-3);">
      <div style="flex:1;">
        <label class="form-label" for="start_date">开始</label>
        <input class="input" id="start_date" name="start_date" type="date" required value="{{ trip.start_date.isoformat() if trip else '' }}">
      </div>
      <div style="flex:1;">
        <label class="form-label" for="end_date">结束（可选）</label>
        <input class="input" id="end_date" name="end_date" type="date" value="{{ trip.end_date.isoformat() if trip and trip.end_date else '' }}">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="description">随笔</label>
      <textarea class="input" id="description" name="description" rows="4">{{ trip.description or '' if trip else '' }}</textarea>
    </div>
    <button class="btn" type="submit" style="width:100%;">{{ '保存' if trip else '创建' }}</button>
  </form>

  {% if trip %}
    <div style="margin-top: var(--space-6);">
      <h3>照片</h3>
      {% if media_list %}
        <div style="display:flex; flex-wrap:wrap; gap: var(--space-2); margin-bottom: var(--space-3);">
          {% for link, m in media_list %}
            <div style="position:relative;">
              <img src="{{ m.thumb_url }}" alt="" style="width:80px; height:80px; object-fit:cover; border-radius:var(--radius-sm); {% if trip.cover_media_id == m.id %}outline:3px solid var(--color-accent);{% endif %}">
              <form action="/trip/{{ trip.id }}/cover/{{ m.id }}" method="post" style="position:absolute; bottom:-6px; left:-6px;">
                <button type="submit" title="设为封面" style="background:white; border:1px solid var(--color-border); border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:11px;">★</button>
              </form>
              <form action="/trip/{{ trip.id }}/media/{{ m.id }}/delete" method="post"
                    style="position:absolute; top:-6px; right:-6px;">
                <button type="submit" style="background:white; border:1px solid var(--color-border); border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:12px;">×</button>
              </form>
            </div>
          {% endfor %}
        </div>
      {% endif %}
      <form id="upload-form" enctype="multipart/form-data">
        <input class="input" type="file" name="file" accept="image/*" id="media-file" multiple>
        <button type="button" class="btn-secondary" onclick="uploadAll()" style="margin-top: var(--space-2);">上传照片</button>
        <span id="upload-status" class="subtitle" style="margin-left: var(--space-2);"></span>
      </form>
    </div>
  {% endif %}
</div>

{% if trip %}
<script>
async function uploadAll() {
  const fileInput = document.getElementById('media-file');
  const status = document.getElementById('upload-status');
  const files = Array.from(fileInput.files);
  if (files.length === 0) return;
  for (let i = 0; i < files.length; i++) {
    status.textContent = `上传 ${i+1}/${files.length}...`;
    const fd = new FormData();
    fd.append('file', files[i]);
    const up = await fetch('/media/upload', { method: 'POST', body: fd });
    if (!up.ok) { status.textContent = '上传失败'; return; }
    const m = await up.json();
    await fetch('/trip/{{ trip.id }}/media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ media_id: m.id }),
    });
  }
  status.textContent = '上传完成';
  setTimeout(() => location.reload(), 500);
}
</script>
{% endif %}
{% endblock %}
