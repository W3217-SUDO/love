{% if chart_series and chart_series.points %}
  <ol class="chart-list">
    {% for point in chart_series.points[-7:] %}
      <li>
        <span>{{ point.date }}</span>
        <strong>{{ point.value }}</strong>
      </li>
    {% endfor %}
  </ol>
{% else %}
  <p class="empty-state">还没有足够的数据生成趋势。</p>
{% endif %}
