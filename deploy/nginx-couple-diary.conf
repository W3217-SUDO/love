server {
    listen 80;
    server_name 150.158.3.104 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 150.158.3.104 _;

    ssl_certificate     /etc/nginx/ssl/couple.crt;
    ssl_certificate_key /etc/nginx/ssl/couple.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline';" always;

    client_max_body_size 60M;

    location /static/ {
        alias /opt/couple_diary/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
